version: 2
updates:
  # Root workspaces (packages/*) + scripts
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Dashboard punya lockfile sendiri
  - package-ecosystem: npm
    directory: "/apps/dashboard"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
