# AEE Fly.io Configuration
app = "aurex-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  AEE_DEV_MODE = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
